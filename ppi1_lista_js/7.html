<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Palindromo</title>
</head>
<body>
    <h1>Verificador de Palindromo</h1>

    <input type="text" id="palavra" placeholder="Digite uma palavra">
    <button onclick="verificar()">Verificar</button>

    <p id="resultado"></p>

<script>
function verificar() {
    var palavra = document.getElementById("palavra").value.toLowerCase();
    var invertida = "";

    for (var i = palavra.length - 1; i >= 0; i--) {
        invertida = invertida + palavra[i];
    }

    if (palavra == "") {
        document.getElementById("resultado").innerHTML = "Digite alguma coisa";
    }
    else if (palavra == invertida) {
        document.getElementById("resultado").innerHTML = palavra + " : é palíndromo";
    }
    else {
        document.getElementById("resultado").innerHTML = palavra + " : não é palíndromo";
    }
}
</script>
</body>
</html>
