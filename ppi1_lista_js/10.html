<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Calculadora</title>
    <style>
        body {
            background-color: #93cfd8;
            font-family: Arial;
        }
        .calc {
            width: 320px;
            margin: 50px auto;
            border-radius: 10px;
            overflow: hidden;
        }
        #visor {
            background-color: #222;
            color: white;
            font-size: 40px;
            text-align: right;
            padding: 20px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        td {
            border: 1px solid #aaa;
            padding: 0;
        }
        button {
            width: 100%;
            height: 60px;
            font-size: 22px;
            border: none;
            background-color: white;
        }
        .op {
            background-color: #e6e6e6;
        }
        .igual {
            height: 244px;
            background-color: #f7845a;
        }
    </style>
</head>
<body>
    <div class="calc">
        <div id="visor">0</div>
        <table>
            <tr>
                <td><button class="op" onclick="operacao('+')">+</button></td>
                <td><button class="op" onclick="operacao('-')">-</button></td>
                <td><button class="op" onclick="operacao('*')">×</button></td>
                <td><button class="op" onclick="operacao('/')">÷</button></td>
            </tr>
            <tr>
                <td><button onclick="numero('7')">7</button></td>
                <td><button onclick="numero('8')">8</button></td>
                <td><button onclick="numero('9')">9</button></td>
                <td rowspan="4"><button class="igual" onclick="calcular()">=</button></td>
            </tr>
            <tr>
                <td><button onclick="numero('4')">4</button></td>
                <td><button onclick="numero('5')">5</button></td>
                <td><button onclick="numero('6')">6</button></td>
            </tr>
            <tr>
                <td><button onclick="numero('1')">1</button></td>
                <td><button onclick="numero('2')">2</button></td>
                <td><button onclick="numero('3')">3</button></td>
            </tr>
            <tr>
                <td><button onclick="numero('0')">0</button></td>
                <td><button onclick="numero('.')">.</button></td>
                <td><button onclick="limpar()">AC</button></td>
            </tr>
        </table>
    </div>

<script>
var atual = "0";
var anterior = "";
var op = "";
var terminou = false;

function numero(n) {
    if (n == "." && atual.includes(".")) {
        return;
    }
    if (terminou == true) {
        atual = "0";
        terminou = false;
    }
    if (atual == "0" && n != ".") {
        atual = n;
    } else {
        atual = atual + n;
    }
    document.getElementById("visor").innerHTML = atual;
}

function operacao(o) {
    if (op != "") {
        calcular();
    }
    anterior = atual;
    op = o;
    terminou = false;
    atual = "0";
}

function calcular() {
    var a = parseFloat(anterior);
    var b = parseFloat(atual);
    var resultado = 0;

    if (op == "+") {
        resultado = a + b;
    } else if (op == "-") {
        resultado = a - b;
    } else if (op == "*") {
        resultado = a * b;
    } else if (op == "/") {
        if (b == 0) {
            alert("Nao da pra dividir por zero");
            limpar();
            return;
        }
        resultado = a / b;
    } else {
        return;
    }

    atual = String(resultado);
    op = "";
    anterior = "";
    terminou = true;
    document.getElementById("visor").innerHTML = atual;
}

function limpar() {
    atual = "0";
    anterior = "";
    op = "";
    document.getElementById("visor").innerHTML = atual;
}
</script>
</body>
</html>
