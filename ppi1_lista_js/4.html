<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Calculo IMC</title>
</head>
<body>
    <h1>Calculo de IMC</h1>

    Nome: <input type="text" id="nome"><br><br>
    Peso (kg): <input type="number" id="peso" step="0.1"><br><br>
    Altura (m): <input type="number" id="altura" step="0.01"><br><br>
    <button onclick="calcular()">Calcular</button>

    <p id="resultadoIMC"></p>
    <p id="classificacao"></p>
    <img id="imgPerfil" src="" width="150">

<script>
function calcular() {
    var nome = document.getElementById("nome").value;
    var peso = parseFloat(document.getElementById("peso").value);
    var altura = parseFloat(document.getElementById("altura").value);

    if (nome == "" || isNaN(peso) || isNaN(altura)) {
        alert("Preencha todos os campos!");
        return;
    }

    var imc = peso / (altura * altura);
    var classificacao = "";

    if (imc < 18.5) {
        classificacao = "Abaixo do peso";
    } else if (imc < 25) {
        classificacao = "Peso normal";
    } else if (imc < 30) {
        classificacao = "Sobrepeso";
    } else if (imc < 35) {
        classificacao = "Obesidade grau 1";
    } else if (imc < 40) {
        classificacao = "Obesidade grau 2";
    } else {
        classificacao = "Obesidade grau 3 (morbida)";
    }

    document.getElementById("resultadoIMC").innerHTML = nome + ", seu IMC é " + imc.toFixed(2);
    document.getElementById("classificacao").innerHTML = "Classificaçao: " + classificacao;

    var img = document.getElementById("imgPerfil");

    switch (true) {
        case imc < 18.5:
            img.src = "imgs/magro.png";
            break;
        case Math.floor(imc) < 25:
            img.src = "imgs/normal.png";
            break;
        case Math.floor(imc) < 30:
            img.src = "imgs/sobrepeso.png";
            break;
        case Math.floor(imc) < 35:
            img.src = "imgs/obeso1.png";
            break;
        case Math.floor(imc) < 40:
            img.src = "imgs/obeso2.png";
            break;
        default:
            img.src = "imgs/obeso3.png";
    }
}
</script>
</body>
</html>
