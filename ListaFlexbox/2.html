<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercício Layout</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 300px;
            height: 550px;
            border: 3px solid #a000f0;
            border-radius: 8px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            color: #888;
            font-size: 14px;
            margin-top: 10px;
            margin-bottom: 30px;
        }

        .barra {
            width: 100%;
            height: 25px;
            background-color: #e5e5e5;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .espaco {
            flex-grow: 1;
        }

        .circulo {
            width: 60px;
            height: 60px;
            background-color: #e5e5e5;
            border-radius: 50%;
            margin-bottom: 15px;
        }

        .botao {
            width: 80px;
            height: 20px;
            background-color: #e5e5e5;
            border-radius: 4px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo">Company Logo</div>

        <div class="barra"></div>
        <div class="barra"></div>
        <div class="barra"></div>
        <div class="barra"></div>

        <div class="espaco"></div>

        <div class="circulo"></div>
        <div class="botao"></div>
    </div>

</body>
</html>
