<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Lista de Usuários</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #a0a0a0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background-color: white;
            width: 320px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
        }

        .usuario {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #eeeeee;
        }

        .usuario:last-child {
            border-bottom: none;
        }

        .foto {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 15px;
        }

        .info h4 {
            margin: 0;
            color: #444;
            font-size: 15px;
        }

        .info p {
            margin: 3px 0 0 0;
            color: #888;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="card">
        
        <div class="usuario">
            <img src="https://randomuser.me/api/portraits/women/44.jpg" alt="Linda Hart" class="foto">
            <div class="info">
                <h4>Linda Hart</h4>
                <p>6765 Shady Ln Dr</p>
            </div>
        </div>

        <div class="usuario">
            <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="Roger Medina" class="foto">
            <div class="info">
                <h4>Roger Medina</h4>
                <p>2420 Paddock Way</p>
            </div>
        </div>

        <div class="usuario">
            <img src="https://randomuser.me/api/portraits/men/85.jpg" alt="Dean Sullivan" class="foto">
            <div class="info">
                <h4>Dean Sullivan</h4>
                <p>6727 Airplane Ave</p>
            </div>
        </div>

        <div class="usuario">
            <img src="https://randomuser.me/api/portraits/women/68.jpg" alt="Elizabeth Austin" class="foto">
            <div class="info">
                <h4>Elizabeth Austin</h4>
                <p>6685 Blossom Hill Rd</p>
            </div>
        </div>

    </div>

</body>
</html>
